name: CI

on:
  push:
    branches: [main, perf/split-ingestion-latency, feat/merchant-kyc-auth]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pricing_engine
      REDIS_URL: redis://localhost:6379
      MARKET_WS_URL: wss://example.invalid/ws
      MARKET_DATA_MODE: mock
      JWT_SECRET: ci-only-secret-that-is-long-enough-for-validation
      ADMIN_API_KEY: ci-only-development-admin-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1

      - name: Install dependencies
        run: pnpm --dir backend install --frozen-lockfile

      - name: Install frontend dependencies
        run: pnpm --dir frontend install

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
