
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricing-engine-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  mongodb:
    image: mongo:8
    container_name: pricing-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: pricing-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  redis_data:
